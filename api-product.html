 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Products - Axios Integration</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Axios CDN -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Navbar -->
    <nav class="bg-blue-600 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">Nova Gem Studio</h1>
            <div class="space-x-4">
  <a href="index.html">Home</a>
<a href="inventory.html">Inventory (CRUD)</a>
<a href="api-product.html">Api Products</a>
</div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container mx-auto p-6 max-w-6xl">
        <h2 class="text-2xl font-bold mb-6 text-gray-800 text-center">Products from External API (Axios)</h2>

        <!-- Loading / Error states -->
        <div id="loading" class="text-center text-gray-600 text-lg py-10">Loading products via Axios...</div>
        <div id="error" class="text-center text-red-600 font-semibold py-4 hidden"></div>

        <!-- Products Grid -->
        <div id="products-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Dynamic Cards Will Be Injected Here -->
        </div>
    </div>

    <!-- JavaScript Axios Logic -->
    <script>
        const grid = document.getElementById('products-grid');
        const loading = document.getElementById('loading');
        const errorDiv = document.getElementById('error');

        axios.get('https://fakestoreapi.com/products')
            .then(response => {
                loading.style.display = 'none';
                const products = response.data;
                
                products.forEach(product => {
                    const card = document.endingElement || document.createElement('div');
                    card.className = 'bg-white p-4 rounded-lg shadow-md flex flex-col justify-between';
                    card.innerHTML = `
                        <div>
                            <img src="${product.image}" alt="${product.title}" class="h-40 mx-auto object-contain mb-4">
                            <h3 class="font-bold text-gray-800 text-sm mb-2 truncate">${product.title}</h3>
                            <p class="text-blue-600 font-semibold mb-2">$${product.price}</p>
                        </div>
                        <span class="bg-gray-200 text-gray-700 text-xs px-2 py-1 rounded w-max">${product.category}</span>
                    `;
                    grid.appendChild(card);
                });
            })
            .catch(error => {
                loading.style.display = 'none';
                errorDiv.textContent = 'Failed to load products from API. Please check your internet connection.';
                errorDiv.classList.remove('hidden');
            });
    </script>
</body>
</html>
